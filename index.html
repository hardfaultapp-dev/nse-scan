<title>NSE Daily Scan</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e4e2db;--up:#127a43;--down:#b3261e;--accent:#1f4fd1;--chip:#efeee8}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#9c9a92;--line:#33322e;--up:#4cc483;--down:#ff7a6e;--accent:#8aa9ff;--chip:#2a2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 16px 8px;max-width:1100px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px}
main{max-width:1100px;margin:0 auto;padding:8px 16px 40px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
section.wide{grid-column:1/-1}
h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.up{color:var(--up)}.down{color:var(--down)}
.sym{font-weight:600}
.breadth{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 8px;background:var(--chip)}
.breadth .a{background:var(--up)}.breadth .d{background:var(--down)}.breadth .u{background:var(--muted)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend b{color:var(--ink)}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
.filing{padding:9px 0;border-bottom:1px solid var(--line)}
.filing:last-child{border-bottom:0}
.filing .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.filing .cat{font-size:12px;background:var(--chip);border-radius:6px;padding:1px 7px;color:var(--muted)}
.filing .when{margin-left:auto;font-size:12px;color:var(--muted)}
.filing .txt{font-size:13.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
a{color:var(--accent)}
.scroll{overflow-x:auto}
.hrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.go{margin-left:auto;flex:1;min-width:200px;max-width:340px}
.go input{margin:0}
a.sym{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
a.sym:hover{color:var(--accent);border-color:var(--accent)}
.frow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.frow:last-child{border-bottom:0}
.frow .pp{font-size:13.5px}.bull{color:var(--up)}.bear{color:var(--down)}.neut{color:var(--muted)}
.list{max-height:520px;overflow-y:auto}
footer{max-width:1100px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:12.5px}
</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, d=2) => v == null ? "" : Number(v).toLocaleString("en-IN", {minimumFractionDigits:d, maximumFractionDigits:d});
const pct = v => v == null ? "" : `<span class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${v > 0 ? "+" : ""}${num(v)}%</span>`;
const symL = s => D.stock_url ? `<a class="sym" href="${D.stock_url}?s=${encodeURIComponent(s)}">${esc(s)}</a>` : `<span class="sym">${esc(s)}</span>`;
const fmtDate = s => s ? new Date(s + "T00:00:00").toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"}) : "";

$("sub").textContent = D.as_of
  ? `Prices as of ${fmtDate(D.as_of)} · updated ${D.generated_at}`
  : `No price data loaded yet · updated ${D.generated_at}`;

if (D.breadth) {
  const {advances:a, declines:d, unchanged:u} = D.breadth, t = a + d + u || 1;
  $("breadth").innerHTML = `<h2>Market breadth <small>NSE EQ series</small></h2>
    <div class="breadth"><div class="a" style="width:${100*a/t}%"></div><div class="u" style="width:${100*u/t}%"></div><div class="d" style="width:${100*d/t}%"></div></div>
    <div class="legend"><span><b>${a.toLocaleString("en-IN")}</b> advanced</span><span><b>${d.toLocaleString("en-IN")}</b> declined</span><span><b>${u.toLocaleString("en-IN")}</b> unchanged</span><span>A/D ratio <b>${d ? (a/d).toFixed(2) : "–"}</b></span></div>`;
} else { $("breadth").innerHTML = `<h2>Market breadth</h2><div class="empty">Run the bhavcopy job to load prices.</div>`; }

function priceTable(id, title, note, rows, emptyMsg) {
  const body = rows.length ? `<div class="scroll"><table><thead><tr><th>Symbol</th><th>Close ₹</th><th>Change</th><th>Turnover ₹cr</th></tr></thead><tbody>${
    rows.map(r => `<tr><td>${symL(r.symbol)}</td><td>${num(r.close)}</td><td>${pct(r.chg_pct)}</td><td>${num(r.turnover_cr,1)}</td></tr>`).join("")
  }</tbody></table></div>` : `<div class="empty">${emptyMsg}</div>`;
  $(id).innerHTML = `<h2>${title} <small>${note}</small></h2>${body}`;
}
const liq = `turnover ≥ ₹${D.min_turnover_cr} cr`;
priceTable("gainers", "Top gainers", liq, D.gainers || [], "No data yet.");
if (D.stock_url) {
  $("go").style.display = "block";
  $("go").addEventListener("submit", e => { e.preventDefault(); const s = $("gq").value.trim().toUpperCase();
    if (s) location.href = `${D.stock_url}?s=${encodeURIComponent(s)}`; });
}
if (D.forming && D.forming.length) {
  const cls = b => b === "bullish" ? "bull" : b === "bearish" ? "bear" : "neut";
  $("forming").style.display = "block";
  $("forming").innerHTML = `<h2>Chart patterns forming <small>most-traded stocks where a pattern is in place but not yet confirmed</small></h2>` +
    D.forming.map(r => `<div class="frow">${symL(r.s)}<span class="pp">${r.p.map(p => `<span class="${cls(p[1])}">${esc(p[0])}</span>`).join(" · ")}</span><span style="margin-left:auto">${pct(r.d)}</span></div>`).join("");
}
priceTable("losers", "Top losers", liq, D.losers || [], "No data yet.");
priceTable("active", "Most traded", "by turnover", D.active || [], "No data yet.");
const shortHist = `Needs about 200 trading days of history (${D.history_days || 0} loaded). Run <code>bhavcopy --days 250</code>.`;
priceTable("highs", "New 52-week highs", liq, D.highs || [], D.history_days >= 200 ? "None today." : shortHist);
priceTable("lows", "New 52-week lows", liq, D.lows || [], D.history_days >= 200 ? "None today." : shortHist);

$("deals").innerHTML = `<h2>Bulk and block deals <small>${D.deals_date ? fmtDate(D.deals_date) + " · largest first" : ""}</small></h2>` + (D.deals.length
  ? `<div class="scroll list"><table><thead><tr><th>Symbol</th><th style="text-align:left">Client</th><th>Side</th><th>Qty</th><th>Price ₹</th><th>Value ₹cr</th><th>Type</th></tr></thead><tbody>${
      D.deals.map(r => `<tr><td>${symL(r.symbol)}</td><td style="text-align:left">${esc(r.client)}</td><td class="${r.side === "BUY" ? "up" : "down"}">${esc(r.side)}</td><td>${Number(r.quantity).toLocaleString("en-IN")}</td><td>${num(r.price)}</td><td>${num(r.value_cr)}</td><td>${esc(r.deal_type)}</td></tr>`).join("")
    }</tbody></table></div>`
  : `<div class="empty">No deals loaded yet.</div>`);

function renderFilings(q) {
  q = q.trim().toUpperCase();
  const rows = D.filings.filter(f => !q || (f.symbol || "").includes(q) || (f.company || "").toUpperCase().includes(q));
  $("filingList").innerHTML = rows.length ? rows.map(f => {
    const when = f.announced_at ? new Date(f.announced_at).toLocaleString("en-IN", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "";
    const link = /^https:\/\/[a-z0-9.-]*nseindia\.com\//i.test(f.attachment || "") ? ` · <a href="${esc(f.attachment)}" target="_blank" rel="noopener">filing</a>` : "";
    const txt = f.subject && f.subject !== f.category ? `<div class="txt">${esc(f.subject)}${link}</div>` : (link ? `<div class="txt">${link.slice(3)}</div>` : "");
    return `<div class="filing"><div class="top">${symL(f.symbol)}<span class="cat">${esc(f.category)}</span><span class="when">${when}</span></div>${txt}</div>`;
  }).join("") : `<div class="empty">${D.filings.length ? "No filings match." : "No filings loaded yet."}</div>`;
}
$("filings").innerHTML = `<h2>Latest corporate filings <small>${D.filings.length} most recent</small></h2><input id="q" type="search" placeholder="Filter by symbol or company" autocomplete="off"><div class="list" id="filingList"></div>`;
$("q").addEventListener("input", e => renderFilings(e.target.value));
renderFilings("");
</script>
</body>
</html>
